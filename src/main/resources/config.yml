features:
  lectern_bookshelf_link:
    enabled: true
    sneak_read:
      require_empty_hand: true
      reverse: false
  freecam:
    enabled: true
    reset_distance_default: 128
    activation:
      action:
        enabled: true
        window_ticks: 10
      item:
        enabled: true
        material: ENDER_EYE
    restrictions:
      allowed_commands:
        - freecam
        - msg
        - reply
  tour_safety:
    enabled: true
  player_state:
    enabled: true
  command_safeguard:
    enabled: true
  guide_array:
    enabled: true
    debug: false
    click_distance: 4.5
    waypoint_radius: 3.0
    waypoint_vertical_radius: 3.0
    waypoint_dwell_seconds: 2.0
    message_wait_seconds_per_line: 5.0
    course_radius: 4.0
    off_course_grace_seconds: 10.0
    off_course_chat_interval_seconds: 60.0
    follow_display_interval_seconds: 10.0
    flight_speed: 4.0
    follow_flight_speed: 6.0

effects:
  link_success:
    enabled: true
    particle:
      enabled: true
      points_per_edge: 6
      size: 1.1
      lectern_color:
        r: 0
        g: 255
        b: 0
      bookshelf_color:
        r: 255
        g: 255
        b: 0
    sound:
      enabled: true
      key: minecraft:entity.experience_orb.pickup
      volume: 1.0
      pitch: 2.0

command_safeguard:
  blacklist:
    - "/kill @e[]"
    - "/kill @e"

config_version: 12
