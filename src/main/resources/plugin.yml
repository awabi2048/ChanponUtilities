name: Chanpon-Utilities
main: me.awabi2048.chanponutilities.ChanponUtilitiesPlugin
version: ${project.version}
api-version: "26.1.2"
depend:
  - CC-System
softdepend:
  - MyWorldManager
  - GSit
  - ProtocolLib

commands:
  beplayerhead:
    description: 統合版プレイヤーのスキンを使用したヘッドを取得します
    usage: /beplayerhead <player name>
    permission: chanponutilities.beplayerhead
  cu:
    description: Chanpon-Utilitiesのサーバー全体機能を管理します
    usage: /cu <status|enable|disable> [module]
    permission: chanponutilities.admin
  freecam:
    description: FreeCamを開始または終了します
    usage: /freecam [start|stop|status|toggle_shortcut|reset_distance]
    permission: chanponutilities.freecam
  anzen:
    description: 観光用の安全機能を切り替えます
    usage: /anzen
    permission: chanponutilities.anzen
  guide:
    description: ガイドアレイによるルート案内を操作します
    usage: /guide [start [route]|stop|status|admin <setpoint|reload>]

permissions:
  chanponutilities.beplayerhead:
    description: 統合版プレイヤーのヘッドを取得する権限
    default: op
  chanponutilities.admin:
    description: Chanpon-Utilities 全機能の管理権限
    default: op
    children:
      chanponutilities.link: true
      chanponutilities.read: true
      chanponutilities.freecam: true
      chanponutilities.guide.admin: true
  chanponutilities.link:
    description: 本棚設置時に書見台リンクを作成する権限
    default: true
  chanponutilities.read:
    description: リンクされた本棚から書見台の本を読む権限
    default: true
  chanponutilities.freecam:
    description: FreeCamを使用する権限
    default: true
  chanponutilities.anzen:
    description: 観光用の安全機能を使用する権限
    default: true
  chanponutilities.guide:
    description: ガイドアレイを利用する権限
    default: true
  chanponutilities.guide.admin:
    description: ガイドルートの管理（中継点登録・再読込）権限
    default: op
