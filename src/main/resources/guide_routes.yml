# ガイドアレイのルート定義です。
#
# routes.<id>: ルート識別子。/guide start <id> で参照します。
# 管理者は /guide start <id> @p で実行位置に最も近いプレイヤーを指定できます。
# /guide admin resetauto <id> @p でも同じプレイヤーを指定できます。
#   name: 任意の表示名（省略時は id を表示します）
#   world: 対象ワールド名（必須。ルートは単一ワールド内に限定します）
#   auto_start: 自動開始領域（省略可）。ルートと同じ world を指定します。
#     world: world
#     from: {x: 0, y: 60, z: -10}  # 向かい合う2頂点の整数座標
#     to:   {x: 10, y: 70, z: 10}   # 各軸の大小はどちらでも構いません。
#     境界を含みます。重なった場合は設定ファイルで先のルートを開始します。
#     通常移動は5 tickごとの位置で判定するため、間に通過した場合は検知しません。
#     ログイン・ワールド移動時も領域内なら開始します。進行中は新規開始しません。
#   points: 通過順に並べた地点（1件以上）。
#     - x, y, z: アレイの座標（足元）
#       yaw, pitch: 出現演出時の方角（待機・移動中はプレイヤーを向く）
#       message: text と任意の delay を持つ行の一覧（省略可、&カラーコード可）
#         delay なしは地点で、delay ありは出発後の移動 tick で送信します。
#         message がないか空の地点は停止せずに通過します。
#
# 各中継点では範囲内で2秒間連続して滞在するとメッセージを送信し、
# メッセージを1行ずつ送り、各行の表示文字数×5 tick待ちます。
# 最後の行の後も同じ時間待ち、送信開始後は範囲外でも進行します。
#
# ゲーム内では /guide admin setpoint <route> <index> で現在位置・向きを
# 中継点として保存でき、/guide admin reload でこのファイルを再読込します。
# 地点番号は points の先頭からの整数で指定します。

routes:
