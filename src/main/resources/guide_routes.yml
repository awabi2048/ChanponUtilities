# ガイドアレイのルート定義です。
#
# routes.<id>: ルート識別子。/guide start <id> で参照します。
#   name: 任意の表示名（省略時は id を表示します）
#   world: 対象ワールド名（必須。ルートは単一ワールド内に限定します）
#   points: 中継点の列（1件以上）。
#     - x, y, z: アレイが待機する座標（足元）
#       yaw, pitch: 待機中にアレイが向く方角
#       message: その中継点の完了時にプレイヤーへ送る行（省略可、&カラーコード可）
#
# 先頭の中継点でもアレイのクリックが必要です。ガイド開始時、アレイは
# 1 点目で待機し、クリックで完了となって次の中継点へ向かいます。
#
# ゲーム内では /guide admin setpoint <route> <index> で現在位置・向きを
# 中継点として保存でき、/guide admin reload でこのファイルを再読込します。
# /guide admin setpoint <route> 3.5 は3番と4番の間の通過点を保存します。
# 中間点は midpoints の区間番号をキーとして保存され、クリック・待機はありません。
# 例: midpoints: {"3": {x: 10.5, y: 65.0, z: 5.5}}

routes:
